{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Device | Advers</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="bg-base-100 min-h-screen p-6">
    <div class="max-w-2xl mx-auto">
        <!-- Page Header -->
        <div class="mb-6">
            <nav class="flex items-center gap-1.5 text-sm">
                <a href="#" class="link link-hover text-base-content/50">Devices</a>
                <svg class="w-3 h-3 text-base-content/30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                <span class="font-semibold">Register Device</span>
            </nav>
            <div class="mt-1">
                <h1 class="text-xl font-bold tracking-tight">Register New Billboard Screen</h1>
                <p class="text-sm text-base-content/50 mt-1">Add a new physical billboard screen to the network.</p>
            </div>
        </div>
        <div class="card card-border bg-base-200 border-base-300 rounded-xl shadow-xl">
            <div class="card-body">
                
                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    
                    {{ form.as_p }}

                    <div class="flex gap-3 pt-4">
                        <button type="submit" class="btn btn-success">Save Device</button>
                        <a href="#" class="btn btn-ghost">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    {% include "partials/theme_toggle.html" %}
</body>
</html>
