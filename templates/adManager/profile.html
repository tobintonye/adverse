{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Manager Profile | Advers</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="bg-black flex items-center justify-center min-h-screen p-4 text-zinc-300">

    <div class="w-full max-w-lg bg-black p-8 rounded-2xl border border-zinc-800 shadow-2xl">

        <!-- Logo & Heading -->
        <div class="text-center mb-8">
            <img src="{% static 'images/logo.png' %}" alt="AdVerse" class="w-12 h-12 object-contain mx-auto mb-4">
            <h2 class="text-xl font-bold tracking-tight text-white">Set up your Ad Manager profile</h2>
            <p class="text-zinc-400 text-sm mt-1">Tell us about your billboard business</p>
        </div>

        <!-- Flash Messages -->
        {% if messages %}
        <div class="mb-5 space-y-2">
            {% for message in messages %}
            <div class="p-3 text-sm rounded-lg {% if message.tags == 'error' %}bg-red-900/20 border border-red-500/50 text-red-400{% else %}bg-green-900/20 border border-green-500/50 text-green-400{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <!-- Section: Business Details -->
            <div>
                <h3 class="text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-3">Business Details</h3>
                <div class="space-y-4">

                    <div>
                        <label class="block text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-1.5">Business Name</label>
                        <input type="text" name="{{ form.business_name.name }}" placeholder="e.g. Acme Media Group" required
                               value="{{ form.business_name.value|default_if_none:'' }}"
                               class="w-full px-3.5 py-2.5 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-1.5">Business Type</label>
                        <select name="{{ form.business_type.name }}"
                                class="w-full px-3.5 py-2.5 bg-black border border-zinc-800 rounded-lg text-sm text-white focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
                            {% for value, label in form.fields.business_type.choices %}
                            <option value="{{ value }}" {% if form.business_type.value == value %}selected{% endif %} class="bg-black">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-1.5">CAC Reg. Number</label>
                            <input type="text" name="{{ form.company_registration_number.name }}" placeholder="Optional"
                                   value="{{ form.company_registration_number.value|default_if_none:'' }}"
                                   class="w-full px-3.5 py-2.5 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-1.5">Tax ID</label>
                            <input type="text" name="{{ form.tax_identification_number.name }}" placeholder="Optional"
                                   value="{{ form.tax_identification_number.value|default_if_none:'' }}"
                                   class="w-full px-3.5 py-2.5 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
                        </div>
                    </div>

                </div>
            </div>

            <!-- Section: Contact -->
            <div>
                <h3 class="text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-3">Contact</h3>
                <div class="space-y-4">

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-1.5">Business Email</label>
                            <input type="email" name="{{ form.business_email.name }}" placeholder="contact@business.com" required
                                   value="{{ form.business_email.value|default_if_none:'' }}"
                                   class="w-full px-3.5 py-2.5 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-1.5">Business Phone</label>
                            <input type="text" name="{{ form.business_phone.name }}" placeholder="e.g. 08012345678" required
                                   value="{{ form.business_phone.value|default_if_none:'' }}"
                                   class="w-full px-3.5 py-2.5 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-1.5">Website</label>
                        <input type="url" name="{{ form.website.name }}" placeholder="https://yourbusiness.com"
                               value="{{ form.website.value|default_if_none:'' }}"
                               class="w-full px-3.5 py-2.5 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
                    </div>

                </div>
            </div>

            <!-- Section: Location -->
            <div>
                <h3 class="text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-3">Location</h3>
                <div class="space-y-4">

                    <div>
                        <label class="block text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-1.5">Address</label>
                        <textarea name="{{ form.address.name }}" rows="3" placeholder="Full business address..." required
                                  class="w-full px-3.5 py-2.5 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition resize-none">{{ form.address.value|default_if_none:'' }}</textarea>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-1.5">City</label>
                            <input type="text" name="{{ form.city.name }}" placeholder="e.g. Lagos" required
                                   value="{{ form.city.value|default_if_none:'' }}"
                                   class="w-full px-3.5 py-2.5 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-1.5">State</label>
                            <input type="text" name="{{ form.state.name }}" placeholder="e.g. Lagos State" required
                                   value="{{ form.state.value|default_if_none:'' }}"
                                   class="w-full px-3.5 py-2.5 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-zinc-300 uppercase tracking-widest mb-1.5">Country</label>
                            <input type="text" name="{{ form.country.name }}" value="{{ form.country.value|default:'Nigeria' }}" required
                                   class="w-full px-3.5 py-2.5 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
                        </div>
                    </div>

                </div>
            </div>

            <!-- Submit -->
            <button type="submit"
                    class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg transition-all duration-200 mt-2 shadow-lg shadow-red-900/20 active:scale-95">
                Create Profile
            </button>

        </form>

    </div>

</body>
</html>
