{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0A0A0B',
          panel: '#131316',
          accent: '#3E8CFF',
        },
        fontFamily: {
          display: ['Space Grotesk', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-bg text-white font-sans min-h-screen p-6 py-16">
  <div class="w-full max-w-2xl mx-auto">

    <!-- Logo & Heading -->
    <div class="text-center mb-8">
      <img src="{% static 'images/logo.png' %}" alt="Advers" class="w-12 h-12 object-contain mx-auto mb-4 drop-shadow-lg">
      <h2 class="font-display font-bold text-xl tracking-tight">Set up your Ad Manager profile</h2>
      <p class="text-white/50 text-sm mt-1.5">Tell us about your billboard business</p>
    </div>

    <!-- Flash Messages -->
    {% if messages %}
    <div class="mb-6 space-y-2">
      {% for message in messages %}
      <div class="p-3 text-sm rounded-lg border
        {% if message.tags == 'error' %}
          bg-red-500/10 border-red-500/30 text-red-400
        {% else %}
          bg-emerald-500/10 border-emerald-500/30 text-emerald-400
        {% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" class="space-y-8">
      {% csrf_token %}

      <!-- Section: Business Details -->
      <div>
        <h3 class="text-[10px] font-bold text-white/40 uppercase tracking-widest mb-4">Business details</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-[10px] uppercase tracking-wider text-white/85 mb-2">Business name</label>
            <input type="text" name="{{ form.business_name.name }}" placeholder="e.g. Acme Media Group" required
                   value="{{ form.business_name.value|default_if_none:'' }}"
                   class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-wider text-white/85 mb-2">Business type</label>
            <select name="{{ form.business_type.name }}"
                    class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
              {% for value, label in form.fields.business_type.choices %}
              <option value="{{ value }}" {% if form.business_type.value == value %}selected{% endif %} class="bg-panel text-white">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-[10px] uppercase tracking-wider text-white/85 mb-2">CAC reg. number</label>
              <input type="text" name="{{ form.company_registration_number.name }}" placeholder="Optional"
                     value="{{ form.company_registration_number.value|default_if_none:'' }}"
                     class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
            </div>
            <div>
              <label class="block text-[10px] uppercase tracking-wider text-white/85 mb-2">Tax ID</label>
              <input type="text" name="{{ form.tax_identification_number.name }}" placeholder="Optional"
                     value="{{ form.tax_identification_number.value|default_if_none:'' }}"
                     class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
            </div>
          </div>
        </div>
      </div>

      <!-- Section: Contact -->
      <div class="pt-8 border-t border-white/10">
        <h3 class="text-[10px] font-bold text-white/40 uppercase tracking-widest mb-4">Contact</h3>
        <div class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-[10px] uppercase tracking-wider text-white/85 mb-2">Business email</label>
              <input type="email" name="{{ form.business_email.name }}" placeholder="contact@business.com" required
                     value="{{ form.business_email.value|default_if_none:'' }}"
                     class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
            </div>
            <div>
              <label class="block text-[10px] uppercase tracking-wider text-white/85 mb-2">Business phone</label>
              <input type="text" name="{{ form.business_phone.name }}" placeholder="e.g. 08012345678" required
                     value="{{ form.business_phone.value|default_if_none:'' }}"
                     class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
            </div>
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-wider text-white/85 mb-2">Website</label>
            <input type="url" name="{{ form.website.name }}" placeholder="https://yourbusiness.com"
                   value="{{ form.website.value|default_if_none:'' }}"
                   class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
          </div>
        </div>
      </div>

      <!-- Section: Location -->
      <div class="pt-8 border-t border-white/10">
        <h3 class="text-[10px] font-bold text-white/40 uppercase tracking-widest mb-4">Location</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-[10px] uppercase tracking-wider text-white/85 mb-2">Address</label>
            <textarea name="{{ form.address.name }}" rows="3" placeholder="Full business address..." required
                      class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition resize-none">{{ form.address.value|default_if_none:'' }}</textarea>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-[10px] uppercase tracking-wider text-white/85 mb-2">City</label>
              <input type="text" name="{{ form.city.name }}" placeholder="e.g. Lagos" required
                     value="{{ form.city.value|default_if_none:'' }}"
                     class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
            </div>
            <div>
              <label class="block text-[10px] uppercase tracking-wider text-white/85 mb-2">State</label>
              <input type="text" name="{{ form.state.name }}" placeholder="e.g. Lagos State" required
                     value="{{ form.state.value|default_if_none:'' }}"
                     class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
            </div>
            <div>
              <label class="block text-[10px] uppercase tracking-wider text-white/85 mb-2">Country</label>
              <input type="text" name="{{ form.country.name }}" value="{{ form.country.value|default:'Nigeria' }}" required
                     class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
            </div>
          </div>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit"
              class="w-full py-2.5 bg-accent hover:bg-blue-400 text-[#06101F] text-sm font-semibold rounded-lg transition-all duration-200 active:scale-[0.98]">
        Create profile
      </button>
    </form>

  </div>
</body>
</html>
