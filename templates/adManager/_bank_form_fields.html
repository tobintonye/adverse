<!-- Account number -->
<div class="space-y-1.5 mb-4">
    <label class="block text-xs font-medium text-white/70">
        Account numbers
    </label>
    <input type="text" name="account_number"
           class="w-full bg-bg border border-white/10 rounded-lg p-2.5 text-sm tracking-widest text-white placeholder-white/30 focus:outline-none focus:border-emerald-500/60 transition account-number-input"
           placeholder="10-digit account number"
           maxlength="10"
           pattern="[0-9]{10}"
           inputmode="numeric"
           required>
    <p class="text-[11px] text-white/40">Must be exactly 10 digits</p>
</div>

<script>
    document.querySelectorAll('.account-number-input').forEach(function(el) {
        el.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 10);
        });
    });
</script>
