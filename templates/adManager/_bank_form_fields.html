<!-- Account number -->
<div class="form-control mb-4">
    <label class="label pb-1">
        <span class="label-text text-xs font-medium">Account number <span class="text-error">*</span></span>
    </label>
    <input type="text" name="account_number"
           class="input input-bordered input-sm w-full font-mono tracking-widest account-number-input"
           placeholder="10-digit account number"
           maxlength="10"
           pattern="[0-9]{10}"
           inputmode="numeric"
           required>
    <label class="label pt-1">
        <span class="label-text-alt text-base-content/40">Must be exactly 10 digits</span>
    </label>
</div>

<script>
    document.querySelectorAll('.account-number-input').forEach(function(el) {
        el.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 10);
        });
    });
</script>
