<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Something went wrong — Advers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/base.css">
</head>
<body>

<section style="min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px;">
    <div class="wrap" style="max-width: 640px; text-align:center;">

        <p class="eyebrow" style="margin-bottom: 18px;">Error 500</p>

        <h1 style="font-family:'Space Grotesk', sans-serif; font-weight:600; font-size: clamp(48px, 8vw, 96px); line-height:1; color: var(--text-hi); margin-bottom: 20px;">
            Something went wrong
        </h1>

        <p style="font-size: 16px; line-height:1.6; color: var(--text-mid); max-width: 440px; margin: 0 auto 40px;">
            An unexpected error occurred on our end. It's been logged and we're looking into it — please try again in a moment.
        </p>

        <div style="display:flex; align-items:center; justify-content:center; gap: 14px; flex-wrap: wrap;">
            <a href="/" class="btn btn-primary">Go to homepage</a>
            <a href="javascript:location.reload()" class="btn btn-ghost">Try again</a>
        </div>

    </div>
</section>

</body>
</html>
