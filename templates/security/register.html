<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-center min-h-screen p-4 text-white">

    <!-- Compact Container: Pure Black with a thin Zinc border -->
    <div class="w-full max-w-sm bg-black p-6 rounded-xl border border-zinc-800 shadow-2xl">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h2 class="text-xl font-bold tracking-tight text-white">Create Account</h2>
        </div>

        <!-- Google Signup: White/Silver contrast -->
        <div class="mb-4">
            <a href="{% url 'socialaccount_signup' %}" class="flex items-center justify-center gap-2 w-full py-2 px-4 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-zinc-100 font-medium rounded-lg transition text-sm">
                <svg width="16" height="16" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
                    <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.04a4.8 4.8 0 0 1-2.7.75 4.8 4.8 0 0 1-4.52-3.36H1.83v2.07A8 8 0 0 0 8.98 17z"/>
                    <path fill="#FBBC05" d="M4.46 10.41a4.8 4.8 0 0 1-.25-1.41c0-.49.09-.97.25-1.41V5.52H1.83a8 8 0 0 0 0 7.37l2.63-2.48z"/>
                    <path fill="#EA4335" d="M8.98 4.23c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 8.98 1 8 8 0 0 0 1.83 5.52L4.46 7.6A4.77 4.77 0 0 1 8.98 4.23z"/>
                </svg>
                Continue with Google
            </a>
        </div>

        <!-- Divider -->
        <div class="flex items-center my-4">
            <div class="flex-grow border-t border-zinc-800"></div>
            <span class="px-3 text-zinc-600 text-[10px] font-bold uppercase tracking-widest">or</span>
            <div class="flex-grow border-t border-zinc-800"></div>
        </div>

        <!-- Form -->
        <form method="post" class="space-y-3">
            {% csrf_token %}
            
            <!-- Email -->
            <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1 ml-1">Email</label>
                <input type="email" 
                       name="{{ form.email.name }}" 
                       placeholder="you@example.com" 
                       required
                       class="w-full px-3 py-2 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
                {% for error in form.email.errors %}
                    <div class="text-white-500 text-[10px] mt-1">{{ error }}</div>
                {% endfor %}
            </div>

            <!-- Password -->
            <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1 ml-1">Password</label>
                <input type="password" 
                       name="{{ form.password.name }}" 
                       placeholder="••••••••" 
                       required
                       class="w-full px-3 py-2 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1 ml-1">Confirm</label>
                <input type="password" 
                       name="{{ form.password2.name }}" 
                       placeholder="••••••••" 
                       required
                       class="w-full px-3 py-2 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
            </div>
            
            <!-- Submit Button: Red Accent -->
            <button type="submit" 
                    class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg transition-all duration-200 mt-2 shadow-lg shadow-red-900/20 active:scale-95">
                Sign Up
            </button>

            <!-- Login Link -->
            <div class="text-center mt-4">
                <p class="text-zinc-500 text-xs">
                    Already registered? 
                    <a href="{% url 'security:login' %}" class="text-red-500 font-bold hover:text-red-400">Log in</a>
                </p>
            </div>
        </form>
    </div>

</body>
</html>
