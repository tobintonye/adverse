{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — Advers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0A0A0B',
          panel: '#131316',
          accent: '#3E8CFF',
        },
        fontFamily: {
          display: ['Space Grotesk', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-bg text-white font-sans min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-sm bg-panel border border-white/10 rounded-2xl p-10 shadow-2xl">

    <div class="text-center mb-8">
      <img src="{% static 'images/logo.png' %}" alt="Adverse" class="w-11 h-11 object-contain mx-auto mb-4 drop-shadow-lg">
      <h2 class="font-display font-bold text-xl tracking-tight">Change password</h2>
      <p class="text-white/50 text-sm mt-1.5">Enter your current password and choose a new one</p>
    </div>

    <!-- Flash Messages -->
    {% if messages %}
    <div class="mb-5 space-y-2">
      {% for message in messages %}
      <div class="p-3 text-sm rounded-lg border
        {% if message.tags == 'error' %}
          bg-red-500/10 border-red-500/30 text-red-400
        {% else %}
          bg-emerald-500/10 border-emerald-500/30 text-emerald-400
        {% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block font-mono text-[10px] uppercase tracking-wider text-white/60 mb-2">Current password</label>
        <input type="password" name="old_password" required
               class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
      </div>

      <div>
        <label class="block font-mono text-[10px] uppercase tracking-wider text-white/60 mb-2">New password</label>
        <input type="password" name="new_password1" required
               class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
      </div>

      <div>
        <label class="block font-mono text-[10px] uppercase tracking-wider text-white/60 mb-2">Confirm new password</label>
        <input type="password" name="new_password2" required
               class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
      </div>

      <button type="submit"
              class="w-full py-2.5 bg-accent hover:bg-blue-400 text-[#06101F] text-sm font-semibold rounded-lg transition-all duration-200 active:scale-[0.98]">
        Update password
      </button>

      <div class="text-center pt-1">
        <a href="javascript:history.back()" class="text-xs text-white/50 hover:text-white transition">&larr; Back to settings</a>
      </div>
    </form>

  </div>

</body>
</html>
