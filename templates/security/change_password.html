{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — Advers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0D0D0E',
          panel: '#171717',
          accent: '#3E8CFF',
        },
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-bg text-white font-sans min-h-svh flex flex-col items-center justify-center p-4">

  <!-- Compact 340px container matching Register/Login -->
  <div class="w-full max-w-[340px] py-6 flex flex-col items-center">

    <!-- Header -->
    <div class="text-center mb-8">
      <img src="{% static 'images/logo.png' %}" alt="Adverse" class="w-10 h-10 object-contain mx-auto mb-4">
      <h2 class="font-bold text-2xl tracking-tight">Change password</h2>
    </div>

    <!-- Flash Messages -->
    {% if messages %}
    <div class="w-full mb-5 space-y-2">
      {% for message in messages %}
      <div class="p-3 text-xs sm:text-sm rounded-full border text-center
        {% if message.tags == 'error' %}
          bg-red-500/10 border-red-500/30 text-red-400
        {% else %}
          bg-emerald-500/10 border-emerald-500/30 text-emerald-400
        {% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <!-- Form -->
    <form method="post" class="w-full space-y-3">
      {% csrf_token %}

      <!-- Current Password -->
      <div>
        <input type="password" name="old_password" placeholder="Current password" required
               class="w-full bg-[#0D0D0E] border border-white/20 focus:border-accent rounded-full px-4 py-3 text-sm text-white placeholder-white/40 focus:outline-none focus:ring-1 focus:ring-accent transition appearance-none">
      </div>

      <!-- New Password -->
      <div>
        <input type="password" name="new_password1" placeholder="New password" required
               class="w-full bg-[#0D0D0E] border border-white/20 focus:border-accent rounded-full px-4 py-3 text-sm text-white placeholder-white/40 focus:outline-none focus:ring-1 focus:ring-accent transition appearance-none">
      </div>

      <!-- Confirm New Password -->
      <div>
        <input type="password" name="new_password2" placeholder="Confirm new password" required
               class="w-full bg-[#0D0D0E] border border-white/20 focus:border-accent rounded-full px-4 py-3 text-sm text-white placeholder-white/40 focus:outline-none focus:ring-1 focus:ring-accent transition appearance-none">
      </div>

      <!-- Blue Primary Submit Button -->
      <button type="submit"
              class="w-full py-3 bg-accent hover:bg-blue-400 text-[#06101F] text-sm font-semibold rounded-full transition-all duration-200 mt-2 active:scale-[0.98] touch-manipulation cursor-pointer">
        Update password
      </button>

      <!-- Back Link -->
      <div class="text-center pt-3">
        <a href="javascript:history.back()" class="text-xs text-white/50 hover:text-white transition-colors">&larr; Back to settings</a>
      </div>
    </form>

  </div>

</body>
</html>
