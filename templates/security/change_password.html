{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — Advers</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-center min-h-screen p-4 text-white">

    <div class="w-full max-w-sm bg-black p-6 rounded-xl border border-zinc-800 shadow-2xl">

        <div class="text-center mb-6">
            <img src="{% static 'images/logo.png' %}" alt="Advers" class="w-14 h-14 object-contain mx-auto mb-3">
            <h2 class="text-xl font-bold tracking-tight text-white">Change Password</h2>
            <p class="text-zinc-500 text-xs mt-1">Enter your current password and choose a new one</p>
        </div>

        {% if messages %}
        <div class="mb-4 space-y-2">
            {% for message in messages %}
            <div class="p-3 text-sm rounded-lg {% if message.tags == 'error' %}bg-red-900/20 border border-red-500/50 text-red-400{% else %}bg-green-900/20 border border-green-500/50 text-green-400{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1 ml-1">Current Password</label>
                <input type="password" name="old_password" required
                       class="w-full px-3 py-2 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1 ml-1">New Password</label>
                <input type="password" name="new_password1" required
                       class="w-full px-3 py-2 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase mb-1 ml-1">Confirm New Password</label>
                <input type="password" name="new_password2" required
                       class="w-full px-3 py-2 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition">
            </div>

            <button type="submit"
                    class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg transition-all duration-200 shadow-lg shadow-red-900/20 active:scale-95">
                Update Password
            </button>

            <div class="text-center">
                <a href="javascript:history.back()" class="text-zinc-500 text-xs hover:text-zinc-400">← Back to Settings</a>
            </div>
        </form>
    </div>

</body>
</html>
