{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Role</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0D0D0E',
          panel: '#171717',
          accent: '#3E8CFF',
        },
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-bg text-white font-sans min-h-svh flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-[360px] py-6 flex flex-col items-center">

    <div class="text-center mb-8">
      <img src="{% static 'images/logo.png' %}" alt="Adverse" class="w-10 h-10 object-contain mx-auto mb-4">
      <h2 class="font-bold text-2xl tracking-tight">How will you use Advers?</h2>
      <p class="text-white/50 text-xs mt-1">Choose your role. This cannot be changed later.</p>
    </div>

    {% if messages %}
    <div class="w-full mb-5 space-y-2">
      {% for message in messages %}
      <div class="p-3 text-xs sm:text-sm rounded-full border text-center
        {% if message.tags == 'error' %}
          bg-red-500/10 border-red-500/30 text-red-400
        {% else %}
          bg-emerald-500/10 border-emerald-500/30 text-emerald-400
        {% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" class="w-full space-y-3.5">
      {% csrf_token %}
      <button type="submit" name="role" value="advertiser"
              class="group w-full flex items-center text-left gap-4 p-4 bg-[#171717] border border-white/10 hover:border-accent hover:bg-accent/10 rounded-2xl active:scale-[0.98] transition-all duration-200 touch-manipulation cursor-pointer">
        <div class="p-3 bg-white/5 group-hover:bg-accent/20 rounded-xl shrink-0 transition-colors">
          <svg class="w-6 h-6 text-white/70 group-hover:text-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-white">Advertiser</p>
          <p class="text-xs text-white/50 mt-0.5 leading-snug">Run ad campaigns on billboard screens</p>
        </div>
      </button>

      <button type="submit" name="role" value="ad_manager"
              class="group w-full flex items-center text-left gap-4 p-4 bg-[#171717] border border-white/10 hover:border-accent hover:bg-accent/10 rounded-2xl active:scale-[0.98] transition-all duration-200 touch-manipulation cursor-pointer">
        <div class="p-3 bg-white/5 group-hover:bg-accent/20 rounded-xl shrink-0 transition-colors">
          <svg class="w-6 h-6 text-white/70 group-hover:text-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-white">Ad Manager</p>
          <p class="text-xs text-white/50 mt-0.5 leading-snug">Own and manage billboard screens</p>
        </div>
      </button>

    </form>

  </div>

</body>
</html>
