{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role — AdVerse</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-center min-h-screen p-4 text-zinc-300">

    <div class="w-full max-w-md bg-black p-8 rounded-2xl border border-zinc-800 shadow-2xl">

        <div class="text-center mb-8">
            <img src="{% static 'images/logo.png' %}" alt="AdVerse" class="w-12 h-12 object-contain mx-auto mb-4">
            <h2 class="text-xl font-bold tracking-tight text-white">How will you use AdVerse?</h2>
            <p class="text-zinc-400 text-sm mt-1">Choose your role — this can't be changed later</p>
        </div>

        {% if messages %}
        <div class="mb-5 space-y-2">
            {% for message in messages %}
            <div class="p-3 text-sm rounded-lg {% if message.tags == 'error' %}bg-red-900/20 border border-red-500/50 text-red-400{% else %}bg-green-900/20 border border-green-500/50 text-green-400{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="grid grid-cols-2 gap-4">
            {% csrf_token %}

            <button type="submit" name="role" value="advertiser"
                    class="flex flex-col items-center gap-3 p-6 border border-zinc-800 rounded-xl hover:border-red-600 hover:bg-red-600/10 transition-all duration-200 cursor-pointer">
                <svg class="w-7 h-7 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
                </svg>
                <div class="text-center">
                    <p class="text-sm font-bold text-white">Advertiser</p>
                    <p class="text-[11px] text-zinc-400 mt-1 leading-tight">Run ad campaigns on billboard screens</p>
                </div>
            </button>

            <button type="submit" name="role" value="ad_manager"
                    class="flex flex-col items-center gap-3 p-6 border border-zinc-800 rounded-xl hover:border-red-600 hover:bg-red-600/10 transition-all duration-200 cursor-pointer">
                <svg class="w-7 h-7 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
                <div class="text-center">
                    <p class="text-sm font-bold text-white">Ad Manager</p>
                    <p class="text-[11px] text-zinc-400 mt-1 leading-tight">Own and manage billboard screens</p>
                </div>
            </button>

        </form>

    </div>

</body>
</html>
