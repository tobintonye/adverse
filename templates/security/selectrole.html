{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Role — Advers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0A0A0B',
          panel: '#131316',
          accent: '#3E8CFF',
        },
        fontFamily: {
          display: ['Space Grotesk', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-bg text-white font-sans min-h-screen flex items-center justify-center p-4 sm:p-6">

  <div class="w-full max-w-md sm:max-w-xl bg-panel border border-white/10 rounded-2xl p-6 sm:p-10 shadow-2xl">

    <!-- Header -->
    <div class="text-center mb-6 sm:mb-8">
      <img src="{% static 'images/logo.png' %}" alt="Adverse" class="w-10 h-10 sm:w-12 sm:h-12 object-contain mx-auto mb-3.5 sm:mb-4 drop-shadow-lg">
      <h2 class="font-display font-bold text-xl sm:text-2xl tracking-tight">How will you use Advers?</h2>
      <p class="text-white/50 text-xs sm:text-sm mt-1.5">Choose your role this can't be changed later</p>
    </div>

    <!-- Flash Messages -->
    {% if messages %}
    <div class="mb-5 space-y-2">
      {% for message in messages %}
      <div class="p-3 text-sm rounded-lg border
        {% if message.tags == 'error' %}
          bg-red-500/10 border-red-500/30 text-red-400
        {% else %}
          bg-emerald-500/10 border-emerald-500/30 text-emerald-400
        {% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <!-- Form & Buttons -->
    <form method="post" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4">
      {% csrf_token %}

      <!-- Advertiser Button -->
      <button type="submit" name="role" value="advertiser"
              class="group flex sm:flex-col items-center sm:items-center text-left sm:text-center gap-4 sm:gap-3 p-4 sm:p-6 bg-black/30 border border-white/10 rounded-xl hover:border-accent hover:bg-accent/10 active:scale-[0.98] transition-all duration-200 cursor-pointer">
        <div class="p-2.5 sm:p-0 bg-white/5 sm:bg-transparent rounded-lg shrink-0">
          <svg class="w-6 h-6 sm:w-7 sm:h-7 text-white/60 group-hover:text-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-bold text-white">Advertiser</p>
          <p class="text-[12px] sm:text-[11px] text-white/50 mt-0.5 sm:mt-1 leading-snug">Run ad campaigns on billboard screens</p>
        </div>
      </button>

      <!-- Ad Manager Button -->
      <button type="submit" name="role" value="ad_manager"
              class="group flex sm:flex-col items-center sm:items-center text-left sm:text-center gap-4 sm:gap-3 p-4 sm:p-6 bg-black/30 border border-white/10 rounded-xl hover:border-accent hover:bg-accent/10 active:scale-[0.98] transition-all duration-200 cursor-pointer">
        <div class="p-2.5 sm:p-0 bg-white/5 sm:bg-transparent rounded-lg shrink-0">
          <svg class="w-6 h-6 sm:w-7 sm:h-7 text-white/60 group-hover:text-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-bold text-white">Ad Manager</p>
          <p class="text-[12px] sm:text-[11px] text-white/50 mt-0.5 sm:mt-1 leading-snug">Own and manage billboard screens</p>
        </div>
      </button>

    </form>

  </div>

</body>
</html>
