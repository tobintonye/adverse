{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0A0A0B',
          panel: '#131316',
          accent: '#3E8CFF',
        },
        fontFamily: {
          display: ['Space Grotesk', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-bg text-white font-sans min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-sm bg-panel border border-white/10 rounded-2xl p-10 shadow-2xl">

    <!-- Logo & Heading -->
    <div class="text-center mb-8">
      <a href="{% url 'adverse:home' %}" class="inline-block transition-transform hover:scale-105 active:scale-95 duration-200">
        <img src="{% static 'images/logo.png' %}" alt="Adverse" class="w-11 h-11 object-contain mx-auto mb-4 drop-shadow-lg">
      </a>
      <h2 class="font-display font-bold text-xl tracking-tight">Forgot password?</h2>
      <p class="text-white/50 text-sm mt-1.5">No worries, we'll help you reset it</p>
    </div>

    <!-- Flash Messages -->
    {% if messages %}
    <div class="mb-5 space-y-2">
      {% for message in messages %}
      <div class="p-3 text-sm rounded-lg border
        {% if message.tags == 'error' %}
          bg-red-500/10 border-red-500/30 text-red-400
        {% else %}
          bg-emerald-500/10 border-emerald-500/30 text-emerald-400
        {% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <!-- Reset Form -->
    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <!-- Email -->
      <div>
        <label class="block font-mono text-[10px] uppercase tracking-wider text-white/60 mb-2">Email address</label>
        <input type="email" id="email" name="email" placeholder="enter your email" required
               class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
      </div>

      <!-- Captcha -->
      <div class="origin-left scale-90 -my-1">
        {{ form.captcha }}
      </div>

      <!-- Submit -->
      <button type="submit"
              class="w-full py-2.5 bg-accent hover:bg-blue-400 text-[#06101F] text-sm font-semibold rounded-lg transition-all duration-200 active:scale-[0.98]">
        Reset password
      </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center gap-3 my-5">
      <div class="flex-1 h-px bg-white/10"></div>
      <span class="text-xs text-white/40 font-mono">or</span>
      <div class="flex-1 h-px bg-white/10"></div>
    </div>

    <!-- Login Link -->
    <p class="text-center text-white/50 text-sm">
      Remember your password?
      <a href="{% url 'security:login' %}" class="text-accent font-semibold hover:text-blue-400">Log in</a>
    </p>

  </div>

</body>
</html>
