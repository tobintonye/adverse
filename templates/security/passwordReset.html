{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-center min-h-screen p-4 text-zinc-300">

    <!-- Compact Container -->
    <div class="w-full max-w-sm bg-black p-6 rounded-xl border border-zinc-800 shadow-2xl">
        
        <div class="text-center mb-6">
            <img src="{% static 'images/logo.png' %}" alt="Advers" class="w-14 h-14 object-contain mx-auto mb-3">
            <h2 class="text-xl font-bold text-white tracking-tight">Forgot password?</h2>
            <p class="text-zinc-500 text-xs mt-1">No worries, we'll help you reset it</p>
        </div>
        
        <div class="bg-zinc-900/50 border border-zinc-800 text-zinc-300 p-3 rounded-lg text-xs mb-4 text-center" style="display: none;">
            Check your email for reset instructions
        </div>
        
        <!-- Form Section -->
        <div class="form-section">
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                
                <div class="space-y-1">
                    <label for="email" class="block text-[10px] font-bold text-zinc-500 uppercase tracking-widest ml-1">
                        Email Address
                    </label>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           placeholder="enter your email" 
                           class="w-full px-3 py-2 bg-black border border-zinc-800 rounded-lg text-sm text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-red-600 focus:border-red-600 transition" 
                           required>
                </div>
                
                <!-- Captcha Container -->
                <div style="transform: scale(0.85); transform-origin: left center; height: 63px;">
                    {{ form.captcha }}
                </div>
                <button type="submit" 
                        class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg shadow-lg shadow-red-900/20 transition-all active:scale-95">
                    Reset Password
                </button>
            </form>
        </div>
        
        <!-- Divider -->
        <div class="flex items-center my-6">
            <div class="flex-grow border-t border-zinc-800"></div>
            <span class="px-3 text-zinc-600 text-[10px] font-bold uppercase tracking-widest">or</span>
            <div class="flex-grow border-t border-zinc-800"></div>
        </div>
        
        <!-- Secondary Link -->
        <div class="text-center">
            <a href="{% url 'security:login' %}" class="text-zinc-500 text-xs hover:text-red-500 transition font-medium">
                Remember your password? <span class="text-red-500 font-bold">Login</span>
            </a>
        </div>
    </div>

</body>
</html>
