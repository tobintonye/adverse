{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Advers</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }
        @keyframes float-medium {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(-4deg); }
        }
        @keyframes float-fast {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(6deg); }
        }
        .animate-float-slow {
            animation: float-slow 10s ease-in-out infinite;
        }
        .animate-float-medium {
            animation: float-medium 8s ease-in-out infinite;
        }
        .animate-float-fast {
            animation: float-fast 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-base-100 flex items-center justify-center min-h-screen p-4 relative">

<!-- Floating Background Elements -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <!-- Hexagon Top Left -->
    <div class="absolute top-[10%] left-[10%] mouse-follow transition-transform duration-300 ease-out" data-speed="0.03">
        <div class="animate-float-slow">
            <svg fill="none" height="120" viewBox="0 0 100 100" width="120" xmlns="http://www.w3.org/2000/svg">
                <path class="text-primary/20" d="M50 0 L93.3 25 L93.3 75 L50 100 L6.7 75 L6.7 25 Z" stroke="currentColor" stroke-width="0.5"></path>
            </svg>
        </div>
    </div>
    <!-- Circle Bottom Left -->
    <div class="absolute bottom-[15%] left-[15%] mouse-follow transition-transform duration-300 ease-out" data-speed="-0.02">
        <div class="animate-float-medium">
            <svg fill="none" height="150" viewBox="0 0 100 100" width="150" xmlns="http://www.w3.org/2000/svg">
                <circle class="text-secondary/15" cx="50" cy="50" r="40" stroke="currentColor" stroke-width="0.5"></circle>
            </svg>
        </div>
    </div>
    <!-- Square Top Right -->
    <div class="absolute top-[20%] right-[15%] mouse-follow transition-transform duration-300 ease-out" data-speed="0.04">
        <div class="animate-float-fast">
            <svg fill="none" height="80" viewBox="0 0 100 100" width="80" xmlns="http://www.w3.org/2000/svg">
                <rect class="text-primary/20" height="80" rx="12" stroke="currentColor" stroke-width="0.5" transform="rotate(15, 50, 50)" width="80" x="10" y="10"></rect>
            </svg>
        </div>
    </div>
    <!-- Circle Bottom Right -->
    <div class="absolute bottom-[10%] right-[10%] mouse-follow transition-transform duration-300 ease-out" data-speed="-0.03">
        <div class="animate-float-slow">
            <svg fill="none" height="100" viewBox="0 0 100 100" width="100" xmlns="http://www.w3.org/2000/svg">
                <circle class="text-secondary/20" cx="50" cy="50" r="35" stroke="currentColor" stroke-width="0.5"></circle>
            </svg>
        </div>
    </div>
</div>

    <div class="w-full max-w-md mx-auto relative z-10">
        <div class="card card-border bg-base-200 border-base-300 rounded-xl p-6 md:p-8 shadow-2xl">
        
        <div class="text-center mb-6">
            <a href="{% url 'adverse:home' %}" class="inline-block transition-transform hover:scale-105 active:scale-95 duration-200">
                <img src="{% static 'images/logo.png' %}" alt="Advers" class="w-14 h-14 object-contain mx-auto mb-3">
            </a>
            <h2 class="text-xl font-bold tracking-tight">Forgot password?</h2>
            <p class="text-base-content/50 text-xs mt-1">No worries, we'll help you reset it</p>
        </div>
        
        <div class="alert alert-info text-xs mb-4 hidden">
            Check your email for reset instructions
        </div>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <fieldset class="fieldset">
                <legend class="fieldset-legend text-[10px] uppercase">Email Address</legend>
                <input type="email" id="email" name="email" placeholder="enter your email" class="input w-full" required>
            </fieldset>
            
            <!-- Captcha Container -->
            <div style="transform: scale(0.85); transform-origin: left center; height: 63px;">
                {{ form.captcha }}
            </div>
            <button type="submit" class="btn btn-primary w-full">
                Reset Password
            </button>
        </form>
        
        <div class="divider text-[10px] text-base-content/40 uppercase tracking-widest my-6">or</div>
        
        <div class="text-center">
            <a href="{% url 'security:login' %}" class="link link-hover text-base-content/50 text-xs hover:text-primary transition">
                Remember your password? <span class="text-primary font-bold">Login</span>
            </a>
        </div>
    </div>

    {% include "partials/theme_toggle.html" %}

    <script>
        // Mouse follow parallax effect for background SVGs
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            document.querySelectorAll('.mouse-follow').forEach(el => {
                const speed = parseFloat(el.getAttribute('data-speed')) || 0.02;
                const offsetX = (window.innerWidth / 2 - x) * speed;
                const offsetY = (window.innerHeight / 2 - y) * speed;
                el.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            });
        });
    </script>
</body>
</html>
