{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Advers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0D0D0E',
          panel: '#171717',
          accent: '#3E8CFF',
        },
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-bg text-white font-sans min-h-svh flex flex-col items-center justify-center p-4">
  
  <div class="w-full max-w-[340px] py-6 flex flex-col items-center">

    <div class="text-center mb-8">
      <a href="{% url 'adverse:home' %}" class="inline-block transition-transform hover:scale-105 active:scale-95 duration-200">
        <img src="{% static 'images/logo.png' %}" alt="Adverse" class="w-10 h-10 object-contain mx-auto mb-4">
      </a>
      <h2 class="font-bold text-2xl tracking-tight">Forgot password?</h2>
      <p class="text-white/50 text-xs mt-1">No worries, we'll help you reset it</p>
    </div>

    <!-- Flash Messages -->
    {% if messages %}
    <div class="w-full mb-5 space-y-2">
      {% for message in messages %}
      <div class="p-3 text-xs sm:text-sm rounded-full border text-center
        {% if message.tags == 'error' %}
          bg-red-500/10 border-red-500/30 text-red-400
        {% else %}
          bg-emerald-500/10 border-emerald-500/30 text-emerald-400
        {% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}
    <form method="POST" class="w-full space-y-3">
      {% csrf_token %}

      <div>
        <input type="email" id="email" name="email" placeholder="Email address" required
               class="w-full bg-[#0D0D0E] border border-white/20 focus:border-accent rounded-full px-4 py-3 text-sm text-white placeholder-white/40 focus:outline-none focus:ring-1 focus:ring-accent transition appearance-none">
      </div>

      {% if form.captcha %}
      <div class="flex justify-center py-1">
        <div class="scale-90 origin-center">
          {{ form.captcha }}
        </div>
      </div>
      {% endif %}

      <button type="submit"
              class="w-full py-3 bg-accent hover:bg-blue-400 text-[#06101F] text-sm font-semibold rounded-full transition-all duration-200 mt-2 active:scale-[0.98] touch-manipulation cursor-pointer">
        Reset password
      </button>
    </form>

    <div class="flex items-center gap-3 my-5 w-full">
      <div class="flex-1 h-px bg-white/10"></div>
      <span class="text-xs text-white/40 uppercase tracking-widest">or</span>
      <div class="flex-1 h-px bg-white/10"></div>
    </div>

    <p class="text-center text-white/60 text-xs">
      Remember your password?
      <a href="{% url 'security:login' %}" class="text-accent font-semibold hover:text-blue-400 transition-colors">Log in</a>
    </p>

  </div>

</body>
</html>
