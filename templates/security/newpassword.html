{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — Advers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0D0D0E',
          panel: '#171717',
          accent: '#3E8CFF',
        },
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-bg text-white font-sans min-h-svh flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-[340px] py-6 flex flex-col items-center">

    <div class="text-center mb-8">
      <img src="{% static 'images/logo.png' %}" alt="Adverse" class="w-10 h-10 object-contain mx-auto mb-4">
      <h2 class="font-bold text-2xl tracking-tight">Set new password</h2>
    </div>

    <div class="w-full p-3 text-xs rounded-full border bg-accent/10 border-accent/25 text-white/70 text-center mb-5">
      Please choose a <span class="font-semibold text-white">strong password</span> for your account.
    </div>

    <form method="POST" class="w-full space-y-3">
      {% csrf_token %}

      <div>
        <input type="password" id="new_password1" name="new_password1" placeholder="New password" required
               class="w-full bg-[#0D0D0E] border border-white/20 focus:border-accent rounded-full px-4 py-3 text-sm text-white placeholder-white/40 focus:outline-none focus:ring-1 focus:ring-accent transition appearance-none">
        {% for error in form.new_password1.errors %}
          <p class="text-red-400 text-xs mt-1 text-center font-medium">{{ error }}</p>
        {% endfor %}
      </div>

      <div>
        <input type="password" id="new_password2" name="new_password2" placeholder="Confirm new password" required
               class="w-full bg-[#0D0D0E] border border-white/20 focus:border-accent rounded-full px-4 py-3 text-sm text-white placeholder-white/40 focus:outline-none focus:ring-1 focus:ring-accent transition appearance-none">
        {% for error in form.new_password2.errors %}
          <p class="text-red-400 text-xs mt-1 text-center font-medium">{{ error }}</p>
        {% endfor %}
      </div>

      <button type="submit"
              class="w-full py-3 bg-accent hover:bg-blue-400 text-[#06101F] text-sm font-semibold rounded-full transition-all duration-200 mt-2 active:scale-[0.98] touch-manipulation cursor-pointer">
        Change password
      </button>
    </form>

  </div>

</body>
</html>
