{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — Advers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0D0D0E',
          panel: '#171717',
          accent: '#3E8CFF',
        },
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-bg text-white font-sans min-h-svh flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-[340px] py-6 flex flex-col items-center">

    <div class="text-center mb-8">
      <img src="{% static 'images/logo.png' %}" alt="Adverse" class="w-10 h-10 object-contain mx-auto mb-4">
      <h2 class="font-bold text-2xl tracking-tight">Set new password</h2>
    </div>

    <div class="w-full p-3 text-xs rounded-full border bg-accent/10 border-accent/25 text-white/70 text-center mb-5">
      Please choose a <span class="font-semibold text-white">strong password</span> for your account.
    </div>

    <form method="POST" class="w-full space-y-3">
      {% csrf_token %}

      <div>
        <div class="relative password-field">
          <input type="password" name="new_password1" placeholder="New password" required
                 class="w-full bg-[#0D0D0E] border border-white/20 focus:border-accent rounded-full px-4 py-3 pr-11 text-sm text-white placeholder-white/40 focus:outline-none focus:ring-1 focus:ring-accent transition appearance-none">
          <button type="button" class="password-toggle-btn absolute right-4 top-1/2 -translate-y-1/2 text-white/40 hover:text-white/70 transition">
            <svg class="eye-open w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.437 0 .644C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg class="eye-closed w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
        {% for error in form.new_password1.errors %}
          <p class="text-red-400 text-xs mt-1 text-center font-medium">{{ error }}</p>
        {% endfor %}
      </div>

      <div>
        <div class="relative password-field">
          <input type="password" name="new_password2" placeholder="Confirm new password" required
                 class="w-full bg-[#0D0D0E] border border-white/20 focus:border-accent rounded-full px-4 py-3 pr-11 text-sm text-white placeholder-white/40 focus:outline-none focus:ring-1 focus:ring-accent transition appearance-none">
          <button type="button" class="password-toggle-btn absolute right-4 top-1/2 -translate-y-1/2 text-white/40 hover:text-white/70 transition">
            <svg class="eye-open w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.437 0 .644C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg class="eye-closed w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
        {% for error in form.new_password2.errors %}
          <p class="text-red-400 text-xs mt-1 text-center font-medium">{{ error }}</p>
        {% endfor %}
      </div>

      <button type="submit"
              class="w-full py-3 bg-accent hover:bg-blue-400 text-[#06101F] text-sm font-semibold rounded-full transition-all duration-200 mt-2 active:scale-[0.98] touch-manipulation cursor-pointer">
        Change password
      </button>
    </form>

  </div>

<script src="{% static 'js/security/password-toggle.js' %}"></script>
</body>
</html>
