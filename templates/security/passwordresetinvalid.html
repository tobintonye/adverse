{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Expired — Advers</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-center min-h-screen p-4 text-white">

    <div class="w-full max-w-sm bg-black p-8 rounded-2xl border border-zinc-800 shadow-2xl text-center">

        <img src="{% static 'images/logo.png' %}" alt="Advers" class="w-14 h-14 object-contain mx-auto mb-5">

        <div class="mb-6">
            <h2 class="text-xl font-bold text-white tracking-tight">Link Expired</h2>
            <p class="text-zinc-500 text-sm mt-1">This password reset link is invalid or has expired.</p>
        </div>

        <a href="{% url 'security:passwordreset' %}"
           class="block w-full py-2.5 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg transition active:scale-95 mb-4">
            Request New Link
        </a>
        <a href="{% url 'security:login' %}" class="text-xs text-zinc-500 hover:text-zinc-400 transition">
            Back to Login
        </a>
    </div>

</body>
</html>
