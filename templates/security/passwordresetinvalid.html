{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Expired — Advers</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="bg-base-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm">
        <nav class="flex items-center gap-1.5 text-sm mb-4">
            <span class="font-semibold">Link Expired</span>
        </nav>
        <div class="card card-border bg-base-200 border-base-300 rounded-2xl p-8 shadow-2xl text-center">

        <img src="{% static 'images/logo.png' %}" alt="Advers" class="w-14 h-14 object-contain mx-auto mb-5">

        <div class="mb-6">
            <h2 class="text-xl font-bold tracking-tight">Link Expired</h2>
            <p class="text-base-content/50 text-sm mt-1">This password reset link is invalid or has expired.</p>
        </div>

        <a href="{% url 'security:passwordreset' %}" class="btn btn-primary w-full mb-4">
            Request New Link
        </a>
        <a href="{% url 'security:login' %}" class="link link-hover text-xs text-base-content/50 hover:text-base-content transition">
            Back to Login
        </a>
    </div>

    {% include "partials/theme_toggle.html" %}
</body>
</html>
