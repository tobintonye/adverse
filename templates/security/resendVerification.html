{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resend Verification — Advers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0A0A0B',
          panel: '#131316',
          accent: '#3E8CFF',
        },
        fontFamily: {
          display: ['Space Grotesk', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-bg text-white font-sans min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-sm bg-panel border border-white/10 rounded-2xl p-10 shadow-2xl">

    <!-- Logo & Heading -->
    <div class="text-center mb-8">
      <img src="{% static 'images/logo.png' %}" alt="Adverse" class="w-11 h-11 object-contain mx-auto mb-4 drop-shadow-lg">
      <h2 class="font-display font-bold text-xl tracking-tight">Resend verification</h2>
      <p class="text-white/50 text-sm mt-1.5">Enter your email to receive a new link</p>
    </div>

    <!-- Flash Messages -->
    {% if messages %}
    <div class="mb-5 space-y-2">
      {% for message in messages %}
      <div class="p-3 text-sm rounded-lg border
        {% if message.tags == 'error' %}
          bg-red-500/10 border-red-500/30 text-red-400
        {% else %}
          bg-emerald-500/10 border-emerald-500/30 text-emerald-400
        {% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <!-- Resend Form -->
    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block font-mono text-[10px] uppercase tracking-wider text-white/60 mb-2">Email address</label>
        <input type="email" name="email" id="email" placeholder="you@example.com" required
               class="w-full bg-black/40 border border-white/10 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition">
      </div>

      <button type="submit"
              class="w-full py-2.5 bg-accent hover:bg-blue-400 text-[#06101F] text-sm font-semibold rounded-lg transition-all duration-200 active:scale-[0.98]">
        Send link
      </button>
    </form>

    <!-- Back to Login -->
    <div class="text-center mt-6">
      <a href="{% url 'security:login' %}"
         class="inline-flex items-center justify-center gap-1 text-white/50 hover:text-accent text-xs transition">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Back to login
      </a>
    </div>

  </div>

</body>
</html>
