{% load static %}
<footer class="site-footer">
  <div class="wrap footer-row">
    <div class="logo">
      <img
        src="{% static 'images/logo.png' %}"
        alt="Adverse"
        class="logo-mark-img"
        onerror="this.outerHTML='<div class=&quot;logo-mark&quot;></div>'"
      >
      <span class="logo-word">ADVERS</span>
    </div>
    <div class="footer-links">
      <a href="{% url 'adverse:how_it_works' %}">How it works</a>
      <a href="{% url 'adverse:about' %}">About</a>
      <a href="{% url 'adverse:contact' %}">Contact</a>
    </div>
    <div class="footer-meta">
      <a href="mailto:hello@advers.io">hello@advers.io</a>
      <span class="dot">·</span>
      <span>© 2026 Adverse</span>
    </div>
  </div>
</footer>
