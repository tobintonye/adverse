<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adverse</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="bg-base-100 flex items-center justify-center min-h-screen">
    <div class="card card-border bg-base-200 border-base-300 rounded-2xl p-10 shadow-2xl text-center max-w-md">
        <h1 class="text-2xl font-bold tracking-tight mb-2">Welcome to Adverse</h1>
        <p class="text-base-content/50 text-sm">Your advertising management platform</p>
    </div>
    {% include "partials/theme_toggle.html" %}
</body>
</html>
